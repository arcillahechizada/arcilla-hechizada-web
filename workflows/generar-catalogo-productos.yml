name: Actualizar catálogo, blog y mapa del sitio

on:
  push:
    paths:
      - 'data/productos/*.json'
      - 'data/infusiones/*.json'
      - 'data/inciensos/*.json'
      - 'el-grimorio-articulos/*.md'
      - 'scripts/generar-productos.py'
      - 'scripts/generar-blog.py'
      - '.github/workflows/generar-catalogo-productos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Instalar lector de textos
        run: pip install pyyaml
      - name: Generar catálogo
        run: python scripts/generar-productos.py
      - name: Generar blog y mapa del sitio
        run: python scripts/generar-blog.py
      - name: Guardar lo generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/productos.json data/blog.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualiza catálogo, blog y mapa del sitio"
            git pull --rebase origin main
            git push
          fi
