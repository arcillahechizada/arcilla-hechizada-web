# -----------------------------------------------------------------
# BACKEND: configuración REAL generada por DecapBridge para este sitio
# (arcillahechizada/arcilla-hechizada-web), con autenticación PKCE.
# -----------------------------------------------------------------
backend:
  name: git-gateway
  repo: arcillahechizada/arcilla-hechizada-web
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e023609e-6be1-4281-b017-c7fa382553b7/pkce
  auth_token_endpoint: /sites/e023609e-6be1-4281-b017-c7fa382553b7/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

site_url: https://arcillahechizada.github.io/arcilla-hechizada-web

media_folder: "img/uploads"
public_folder: "img/uploads"

locale: "es"

collections:
  # ---------------------------------------------------------------
  # PRODUCTOS ARTESANALES — un archivo independiente por producto
  # ---------------------------------------------------------------
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "data/productos"
    create: true
    delete: true
    identifier_field: "nombre"
    slug: "{{id}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Identificador (único, sin espacios)", name: "id", widget: "string", hint: "No lo cambies una vez publicado." }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Grimorios", value: "grimorios" }
          - { label: "Amuletos", value: "amuletos" }
          - { label: "Pociones", value: "pociones" }
          - { label: "Mandala", value: "mandala" }
          - { label: "Botellitas", value: "botellitas" }
          - { label: "Plantas / Semillas", value: "plantas_semillas" }
          - { label: "Otros", value: "otros" }
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Orden de visualización", name: "orden", widget: "number", required: false, value_type: "int", default: 9999, hint: "Número menor = aparece antes. Usa 1, 2, 3... Si lo dejas en 9999, queda al final." }
      - label: "Colección (opcional)"
        name: "coleccion"
        widget: "select"
        required: false
        default: ""
        options:
          - { label: "Ninguna", value: "" }
          - { label: "Línea Efecto Piedra", value: "linea_efecto_piedra" }
        hint: "Usa Línea Efecto Piedra solo para los amuletos que pertenezcan a esa colección. Así aparecerán dentro de su propia página."
      - { label: "Precio (en euros)", name: "precio", widget: "number", required: false, value_type: "float" }
      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "oculto"
        options:
          - { label: "Disponible", value: "disponible" }
          - { label: "Bajo pedido", value: "bajo_pedido" }
          - { label: "Agotado", value: "agotado" }
          - { label: "Vendido", value: "vendido" }
          - { label: "No publicar todavía", value: "oculto" }
      - { label: "Fotografía principal", name: "imagenPrincipal", widget: "image", required: false, choose_url: false }
      - label: "Galería (varias fotos)"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
      - { label: "Vídeo (enlace, opcional)", name: "video", widget: "string", required: false }
      - { label: "Descripción corta (solo tarjeta)", name: "descripcionCorta", widget: "text", required: false }
      - { label: "Descripción completa (solo ficha)", name: "descripcionCompleta", widget: "text", required: false }
      - { label: "Simbolismo y uso", name: "simbolismo", widget: "text", required: false }
      - { label: "Materiales", name: "materiales", widget: "text", required: false }
      - { label: "Medidas", name: "medidas", widget: "text", required: false }
      - { label: "Cuidados", name: "cuidados", widget: "text", required: false }
      - { label: "Elaboración", name: "elaboracion", widget: "hidden", default: "100% a mano." }
      - { label: "¿Se puede personalizar?", name: "personalizable", widget: "boolean", default: false }
      - { label: "Texto de personalización que verá el cliente", name: "opcionesPersonalizacion", widget: "text", required: false, condition: { field: "personalizable", value: true } }
      - { label: "Activar selector(es) de personalización para el cliente", name: "activarSelectorPersonalizacion", widget: "boolean", default: false, condition: { field: "personalizable", value: true } }
      - label: "Opciones de personalización para el cliente"
        name: "opcionesPersonalizacionCliente"
        widget: "list"
        required: false
        condition: { field: "activarSelectorPersonalizacion", value: true }
        fields:
          - { label: "Nombre del selector", name: "nombre", widget: "string" }
          - label: "Opciones"
            name: "opciones"
            widget: "list"
            field: { label: "Opción", name: "opcion", widget: "string" }
      - { label: "Activar variantes / colores", name: "mostrarVariantes", widget: "boolean", default: false }
      - label: "Variantes / colores"
        name: "variantes"
        widget: "list"
        required: false
        condition: { field: "mostrarVariantes", value: true }
        fields:
          - { label: "Nombre del color / variante", name: "color", widget: "string" }
          - label: "Fotos de esta variante"
            name: "imagenes"
            widget: "list"
            required: false
            field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
          - { label: "¿Disponible?", name: "disponible", widget: "boolean", default: true }
      - { label: "Activar selector Collar / Llavero", name: "mostrarCollarLlavero", widget: "boolean", default: false }
      - label: "Formatos disponibles"
        name: "formatosDisponibles"
        widget: "list"
        required: false
        condition: { field: "mostrarCollarLlavero", value: true }
        field: { label: "Formato", name: "formato", widget: "string" }
      - { label: "¿Se puede pedir otro color no fotografiado?", name: "permiteOtroColor", widget: "boolean", default: false }
      - { label: "Activar compra en la web", name: "activarCompra", widget: "boolean", default: false, hint: "Si está desactivado, la ficha mostrará la información pero no mostrará carrito, WhatsApp ni correo." }
      - label: "Formas de pago disponibles"
        name: "formasPagoDisponibles"
        widget: "list"
        required: false
        condition: { field: "activarCompra", value: true }
        field: { label: "Forma de pago", name: "forma", widget: "string" }
      - { label: "Nota interna (solo la ves tú)", name: "notaInterna", widget: "text", required: false }

  # ---------------------------------------------------------------
  # INFUSIONES — ficha especializada
  # ---------------------------------------------------------------
  - name: "infusiones"
    label: "Infusiones"
    label_singular: "Infusión"
    folder: "data/infusiones"
    create: true
    delete: true
    identifier_field: "nombre"
    slug: "{{id}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Identificador (único, sin espacios)", name: "id", widget: "string" }
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Orden de visualización", name: "orden", widget: "number", required: false, value_type: "int", default: 9999, hint: "Número menor = aparece antes. Usa 1, 2, 3... Si lo dejas en 9999, queda al final." }
      - { label: "Precio (en euros)", name: "precio", widget: "number", required: false, value_type: "float" }
      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "oculto"
        options:
          - { label: "Disponible", value: "disponible" }
          - { label: "Bajo pedido", value: "bajo_pedido" }
          - { label: "Agotado", value: "agotado" }
          - { label: "Vendido", value: "vendido" }
          - { label: "No publicar todavía", value: "oculto" }
      - { label: "Fotografía principal", name: "imagenPrincipal", widget: "image", required: false, choose_url: false }
      - label: "Galería"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
      - { label: "Vídeo (opcional)", name: "video", widget: "string", required: false }
      - { label: "Descripción corta (tarjeta)", name: "descripcionCorta", widget: "text", required: false }
      - { label: "Descripción completa", name: "descripcionCompleta", widget: "text", required: false, hint: "El primer párrafo se verá al principio; el resto aparecerá al pulsar «Leer más»." }
      - { label: "Modo de empleo", name: "modoEmpleo", widget: "text", required: false }
      - { label: "Ingredientes", name: "ingredientes", widget: "text", required: false }
      - { label: "Cantidad / formato", name: "medidas", widget: "string", required: false }
      - { label: "Cuidados", name: "cuidados", widget: "text", required: false }
      - { label: "Elaboración", name: "elaboracion", widget: "hidden", default: "100% a mano." }
      - { label: "Activar compra en la web", name: "activarCompra", widget: "boolean", default: false }
      - label: "Formas de pago disponibles"
        name: "formasPagoDisponibles"
        widget: "list"
        required: false
        condition: { field: "activarCompra", value: true }
        field: { label: "Forma de pago", name: "forma", widget: "string" }
      - { label: "Nota interna (solo la ves tú)", name: "notaInterna", widget: "text", required: false }

  # ---------------------------------------------------------------
  # INCIENSOS — ficha especializada
  # ---------------------------------------------------------------
  - name: "inciensos"
    label: "Inciensos"
    label_singular: "Incienso"
    folder: "data/inciensos"
    create: true
    delete: true
    identifier_field: "nombre"
    slug: "{{id}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Identificador (único, sin espacios)", name: "id", widget: "string" }
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Orden de visualización", name: "orden", widget: "number", required: false, value_type: "int", default: 9999, hint: "Número menor = aparece antes. Usa 1, 2, 3... Si lo dejas en 9999, queda al final." }
      - { label: "Precio (en euros)", name: "precio", widget: "number", required: false, value_type: "float" }
      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "oculto"
        options:
          - { label: "Disponible", value: "disponible" }
          - { label: "Bajo pedido", value: "bajo_pedido" }
          - { label: "Agotado", value: "agotado" }
          - { label: "Vendido", value: "vendido" }
          - { label: "No publicar todavía", value: "oculto" }
      - { label: "Fotografía principal", name: "imagenPrincipal", widget: "image", required: false, choose_url: false }
      - label: "Galería"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
      - { label: "Vídeo (opcional)", name: "video", widget: "string", required: false }
      - { label: "Descripción corta (tarjeta)", name: "descripcionCorta", widget: "text", required: false }
      - { label: "Descripción completa", name: "descripcionCompleta", widget: "text", required: false, hint: "El primer párrafo se verá al principio; el resto aparecerá al pulsar «Leer más»." }
      - { label: "Notas olfativas", name: "notasOlfativas", widget: "text", required: false }
      - { label: "Modo de uso", name: "modoUso", widget: "text", required: false }
      - { label: "Características", name: "caracteristicas", widget: "text", required: false }
      - { label: "Ingredientes", name: "ingredientes", widget: "text", required: false }
      - { label: "Cantidad / formato", name: "medidas", widget: "string", required: false }
      - { label: "Cuidados", name: "cuidados", widget: "text", required: false }
      - { label: "Elaboración", name: "elaboracion", widget: "hidden", default: "100% a mano." }
      - { label: "Activar compra en la web", name: "activarCompra", widget: "boolean", default: false }
      - label: "Formas de pago disponibles"
        name: "formasPagoDisponibles"
        widget: "list"
        required: false
        condition: { field: "activarCompra", value: true }
        field: { label: "Forma de pago", name: "forma", widget: "string" }
      - { label: "Nota interna (solo la ves tú)", name: "notaInterna", widget: "text", required: false }

  - name: "piezas_unicas"
    label: "Piezas Únicas"
    files:
      - file: "data/piezas-unicas.json"
        label: "Piezas únicas"
        name: "piezas"
        fields:
          - label: "Piezas"
            name: "piezas"
            widget: "list"
            label_singular: "Pieza"
            fields:
              - { label: "Identificador", name: "id", widget: "string" }
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Fotografía principal", name: "imagenPrincipal", widget: "image", required: false, choose_url: false }
              - label: "Galería"
                name: "galeria"
                widget: "list"
                required: false
                field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
              - { label: "Vídeo (opcional)", name: "video", widget: "string", required: false }
              - { label: "Precio", name: "precio", widget: "number", required: false, value_type: "float" }
              - { label: "Descripción", name: "descripcion", widget: "text", required: false }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Reservada", value: "reservada" }
                  - { label: "Vendida", value: "vendida" }
              - { label: "Fecha (opcional)", name: "fecha", widget: "string", required: false }

  - name: "opiniones"
    label: "Opiniones"
    files:
      - file: "data/opiniones.json"
        label: "Opiniones"
        name: "opiniones"
        fields:
          - label: "Opiniones"
            name: "opiniones"
            widget: "list"
            label_singular: "Opinión"
            fields:
              - { label: "Identificador", name: "id", widget: "string" }
              - { label: "Nombre o iniciales", name: "nombre", widget: "string" }
              - { label: "Texto de la opinión", name: "texto", widget: "text" }
              - { label: "Producto relacionado (opcional)", name: "producto", widget: "string", required: false }
              - { label: "Fecha (opcional)", name: "fecha", widget: "string", required: false }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options:
                  - { label: "Publicada", value: "publicada" }
                  - { label: "Pendiente de revisar", value: "pendiente" }
                  - { label: "Oculta", value: "oculta" }

  - name: "faq"
    label: "Preguntas frecuentes"
    files:
      - file: "data/faq.json"
        label: "FAQ"
        name: "faq"
        fields:
          - label: "Preguntas"
            name: "faq"
            widget: "list"
            label_singular: "Pregunta"
            fields:
              - { label: "Pregunta", name: "pregunta", widget: "string" }
              - { label: "Respuesta", name: "respuesta", widget: "text" }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options:
                  - { label: "Publicada", value: "publicada" }
                  - { label: "Borrador (no se ve en la web)", value: "borrador" }

  - name: "blog"
    label: "El Grimorio (Blog)"
    folder: "el-grimorio-articulos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen destacada", name: "imagen", widget: "image", required: false, choose_url: false }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        required: false
        options: ["Simbolismo", "Artesanía", "Plantas", "Magia popular", "Regalos", "Cuidados"]
      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "borrador"
        options:
          - { label: "Borrador", value: "borrador" }
          - { label: "Publicado", value: "publicado" }
      - { label: "Título SEO (opcional)", name: "seo_titulo", widget: "string", required: false }
      - { label: "Descripción SEO (opcional)", name: "seo_descripcion", widget: "text", required: false }
      - { label: "Contenido del artículo", name: "body", widget: "markdown" }
