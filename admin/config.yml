# -----------------------------------------------------------------
# BACKEND: configuración REAL generada por DecapBridge para este sitio
# (arcillahechizada/arcilla-hechizada-web), con autenticación PKCE.
# -----------------------------------------------------------------
backend:
  name: git-gateway
  repo: arcillahechizada/arcilla-hechizada-web
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e023609e-6be1-4281-b017-c7fa382553b7/pkce
  auth_token_endpoint: /sites/e023609e-6be1-4281-b017-c7fa382553b7/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

site_url: https://arcillahechizada.github.io/arcilla-hechizada-web

media_folder: "img/uploads"
public_folder: "img/uploads"

locale: "es"

collections:
  # ---------------------------------------------------------------
  # PRODUCTOS ARTESANALES — un archivo independiente por producto
  # ---------------------------------------------------------------
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "data/productos"
    create: true
    delete: true
    identifier_field: "nombre"
    slug: "{{id}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Identificador (único, sin espacios)", name: "id", widget: "string", hint: "No lo cambies una vez publicado." }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Grimorios", value: "grimorios" }
          - { label: "Amuletos", value: "amuletos" }
          - { label: "Pociones", value: "pociones" }
          - { label: "Mandala", value: "mandala" }
          - { label: "Botellitas", value: "botellitas" }
          - { label: "Plantas / Semillas", value: "plantas_semillas" }
          - { label: "Packs para rituales", value: "packs" }
          - { label: "Velas", value: "velas" }
          - { label: "Otros", value: "otros" }
      - { label: "Sección nueva (opcional)", name: "seccion", widget: "relation", collection: "secciones", search_fields: ["nombre"], value_field: "identificador", display_fields: ["nombre"], required: false, hint: "Para meter este producto en una sección que hayas creado (San Valentín, Minerales, Fin de año…). Si es una sección nueva y no encaja en ninguna categoría, pon arriba la categoría «Otros». Las secciones de siempre (Amuletos, Packs, Velas…) se eligen con «Categoría»." }
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Orden de visualización", name: "orden", widget: "number", required: false, value_type: "int", default: 9999, hint: "Número menor = aparece antes. Usa 1, 2, 3... Si lo dejas en 9999, queda al final." }
      - { label: "Destacar en la portada", name: "destacado", widget: "boolean", default: false, required: false, hint: "Si la activas, esta pieza sale en el bloque «Para empezar» de la portada. Mejor entre 4 y 6 piezas. Si no marcas ninguna, la portada elige sola." }
      - { label: "Qué incluye el pack (un producto por línea)", name: "contenidoPack", widget: "list", required: false, field: { label: "Producto", name: "item", widget: "string" }, hint: "Solo para packs: vela, sal negra, mineral, incienso… Se muestra como lista en la ficha." }
      - { label: "Paso a paso del ritual (solo packs)", name: "pasoAPaso", widget: "text", required: false, hint: "Escribe un paso por línea. Se muestra en la ficha del pack." }
      - label: "Colección (opcional)"
        name: "coleccion"
        widget: "select"
        required: false
        default: ""
        options:
          - { label: "Ninguna", value: "" }
          - { label: "Línea Efecto Piedra", value: "linea_efecto_piedra" }
        hint: "Usa Línea Efecto Piedra solo para los amuletos que pertenezcan a esa colección. Así aparecerán dentro de su propia página."
      - { label: "Precio (en euros)", name: "precio", widget: "number", required: false, value_type: "float" }
      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "oculto"
        options:
          - { label: "Disponible", value: "disponible" }
          - { label: "Bajo pedido", value: "bajo_pedido" }
          - { label: "Agotado", value: "agotado" }
          - { label: "Vendido", value: "vendido" }
          - { label: "No publicar todavía", value: "oculto" }
      - { label: "Fotografía principal", name: "imagenPrincipal", widget: "image", required: false, choose_url: false }
      - label: "Galería (varias fotos)"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
      - { label: "Vídeo (enlace, opcional)", name: "video", widget: "string", required: false }
      - { label: "Descripción corta (solo tarjeta)", name: "descripcionCorta", widget: "text", required: false }
      - { label: "Descripción completa (solo ficha)", name: "descripcionCompleta", widget: "text", required: false }
      - { label: "Simbolismo y uso", name: "simbolismo", widget: "text", required: false }
      - { label: "Materiales", name: "materiales", widget: "text", required: false }
      - { label: "Medidas", name: "medidas", widget: "text", required: false }
      - { label: "Cuidados", name: "cuidados", widget: "text", required: false }
      - { label: "Elaboración", name: "elaboracion", widget: "hidden", default: "100% a mano." }
      - { label: "¿Se puede personalizar?", name: "personalizable", widget: "boolean", default: false }
      - { label: "Texto de personalización que verá el cliente", name: "opcionesPersonalizacion", widget: "text", required: false, condition: { field: "personalizable", value: true } }
      - { label: "Activar selector(es) de personalización para el cliente", name: "activarSelectorPersonalizacion", widget: "boolean", default: false, condition: { field: "personalizable", value: true } }
      - label: "Opciones de personalización para el cliente"
        name: "opcionesPersonalizacionCliente"
        widget: "list"
        required: false
        condition: { field: "activarSelectorPersonalizacion", value: true }
        fields:
          - { label: "Nombre del selector", name: "nombre", widget: "string" }
          - label: "Opciones"
            name: "opciones"
            widget: "list"
            field: { label: "Opción", name: "opcion", widget: "string" }
      - { label: "Activar variantes / colores", name: "mostrarVariantes", widget: "boolean", default: false }
      - label: "Variantes / colores"
        name: "variantes"
        widget: "list"
        required: false
        condition: { field: "mostrarVariantes", value: true }
        fields:
          - { label: "Nombre del color / variante", name: "color", widget: "string" }
          - label: "Fotos de esta variante"
            name: "imagenes"
            widget: "list"
            required: false
            field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
          - { label: "¿Disponible?", name: "disponible", widget: "boolean", default: true }
      - { label: "Activar selector Collar / Llavero", name: "mostrarCollarLlavero", widget: "boolean", default: false }
      - label: "Formatos disponibles"
        name: "formatosDisponibles"
        widget: "list"
        required: false
        condition: { field: "mostrarCollarLlavero", value: true }
        field: { label: "Formato", name: "formato", widget: "string" }
      - { label: "¿Se puede pedir otro color no fotografiado?", name: "permiteOtroColor", widget: "boolean", default: false }
      - { label: "Activar compra en la web", name: "activarCompra", widget: "boolean", default: false, hint: "Si está desactivado, la ficha mostrará la información pero no mostrará carrito, WhatsApp ni correo." }
      - label: "Formas de pago disponibles"
        name: "formasPagoDisponibles"
        widget: "select"
        multiple: true
        required: false
        condition: { field: "activarCompra", value: true }
        options: ["Bizum", "PayPal", "Efectivo"]
        default: ["Bizum", "PayPal", "Efectivo"]
        hint: "Marca todas las formas de pago que aceptas para este producto."
      - { label: "Nota interna (solo la ves tú)", name: "notaInterna", widget: "text", required: false }

  # ---------------------------------------------------------------
  # INFUSIONES — ficha especializada
  # ---------------------------------------------------------------
  - name: "infusiones"
    label: "Infusiones"
    label_singular: "Infusión"
    folder: "data/infusiones"
    create: true
    delete: true
    identifier_field: "nombre"
    slug: "{{id}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Identificador (único, sin espacios)", name: "id", widget: "string" }
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Orden de visualización", name: "orden", widget: "number", required: false, value_type: "int", default: 9999, hint: "Número menor = aparece antes. Usa 1, 2, 3... Si lo dejas en 9999, queda al final." }
      - { label: "Precio (en euros)", name: "precio", widget: "number", required: false, value_type: "float" }
      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "oculto"
        options:
          - { label: "Disponible", value: "disponible" }
          - { label: "Bajo pedido", value: "bajo_pedido" }
          - { label: "Agotado", value: "agotado" }
          - { label: "Vendido", value: "vendido" }
          - { label: "No publicar todavía", value: "oculto" }
      - { label: "Fotografía principal", name: "imagenPrincipal", widget: "image", required: false, choose_url: false }
      - label: "Galería"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
      - { label: "Vídeo (opcional)", name: "video", widget: "string", required: false }
      - { label: "Descripción corta (tarjeta)", name: "descripcionCorta", widget: "text", required: false }
      - { label: "Descripción completa", name: "descripcionCompleta", widget: "text", required: false, hint: "El primer párrafo se verá al principio; el resto aparecerá al pulsar «Leer más»." }
      - { label: "Modo de empleo", name: "modoEmpleo", widget: "text", required: false }
      - { label: "Ingredientes", name: "ingredientes", widget: "text", required: false }
      - { label: "Cantidad / formato", name: "medidas", widget: "string", required: false }
      - { label: "Cuidados", name: "cuidados", widget: "text", required: false }
      - { label: "Elaboración", name: "elaboracion", widget: "hidden", default: "100% a mano." }
      - { label: "Activar compra en la web", name: "activarCompra", widget: "boolean", default: false }
      - label: "Formas de pago disponibles"
        name: "formasPagoDisponibles"
        widget: "select"
        multiple: true
        required: false
        condition: { field: "activarCompra", value: true }
        options: ["Bizum", "PayPal", "Efectivo"]
        default: ["Bizum", "PayPal", "Efectivo"]
        hint: "Marca todas las formas de pago que aceptas para este producto."
      - { label: "Nota interna (solo la ves tú)", name: "notaInterna", widget: "text", required: false }

  # ---------------------------------------------------------------
  # INCIENSOS — ficha especializada
  # ---------------------------------------------------------------
  - name: "inciensos"
    label: "Inciensos"
    label_singular: "Incienso"
    folder: "data/inciensos"
    create: true
    delete: true
    identifier_field: "nombre"
    slug: "{{id}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Identificador (único, sin espacios)", name: "id", widget: "string" }
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Orden de visualización", name: "orden", widget: "number", required: false, value_type: "int", default: 9999, hint: "Número menor = aparece antes. Usa 1, 2, 3... Si lo dejas en 9999, queda al final." }
      - { label: "Precio (en euros)", name: "precio", widget: "number", required: false, value_type: "float" }
      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "oculto"
        options:
          - { label: "Disponible", value: "disponible" }
          - { label: "Bajo pedido", value: "bajo_pedido" }
          - { label: "Agotado", value: "agotado" }
          - { label: "Vendido", value: "vendido" }
          - { label: "No publicar todavía", value: "oculto" }
      - { label: "Fotografía principal", name: "imagenPrincipal", widget: "image", required: false, choose_url: false }
      - label: "Galería"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
      - { label: "Vídeo (opcional)", name: "video", widget: "string", required: false }
      - { label: "Descripción corta (tarjeta)", name: "descripcionCorta", widget: "text", required: false }
      - { label: "Descripción completa", name: "descripcionCompleta", widget: "text", required: false, hint: "El primer párrafo se verá al principio; el resto aparecerá al pulsar «Leer más»." }
      - { label: "Notas olfativas", name: "notasOlfativas", widget: "text", required: false }
      - { label: "Modo de uso", name: "modoUso", widget: "text", required: false }
      - { label: "Características", name: "caracteristicas", widget: "text", required: false }
      - { label: "Ingredientes", name: "ingredientes", widget: "text", required: false }
      - { label: "Cantidad / formato", name: "medidas", widget: "string", required: false }
      - { label: "Cuidados", name: "cuidados", widget: "text", required: false }
      - { label: "Elaboración", name: "elaboracion", widget: "hidden", default: "100% a mano." }
      - { label: "Activar compra en la web", name: "activarCompra", widget: "boolean", default: false }
      - label: "Formas de pago disponibles"
        name: "formasPagoDisponibles"
        widget: "select"
        multiple: true
        required: false
        condition: { field: "activarCompra", value: true }
        options: ["Bizum", "PayPal", "Efectivo"]
        default: ["Bizum", "PayPal", "Efectivo"]
        hint: "Marca todas las formas de pago que aceptas para este producto."
      - { label: "Nota interna (solo la ves tú)", name: "notaInterna", widget: "text", required: false }

  - name: "piezas_unicas"
    label: "Piezas Únicas"
    files:
      - file: "data/piezas-unicas.json"
        label: "Piezas únicas"
        name: "piezas"
        fields:
          - label: "Piezas"
            name: "piezas"
            widget: "list"
            label_singular: "Pieza"
            fields:
              - { label: "Identificador", name: "id", widget: "string" }
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Fotografía principal", name: "imagenPrincipal", widget: "image", required: false, choose_url: false }
              - label: "Galería"
                name: "galeria"
                widget: "list"
                required: false
                field: { label: "Foto", name: "foto", widget: "image", choose_url: false }
              - { label: "Vídeo (opcional)", name: "video", widget: "string", required: false }
              - { label: "Precio", name: "precio", widget: "number", required: false, value_type: "float" }
              - { label: "Descripción", name: "descripcion", widget: "text", required: false }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Reservada", value: "reservada" }
                  - { label: "Vendida", value: "vendida" }
              - { label: "Fecha (opcional)", name: "fecha", widget: "string", required: false }

  - name: "opiniones"
    label: "Opiniones"
    files:
      - file: "data/opiniones.json"
        label: "Opiniones"
        name: "opiniones"
        fields:
          - label: "Opiniones"
            name: "opiniones"
            widget: "list"
            label_singular: "Opinión"
            fields:
              - { label: "Identificador", name: "id", widget: "string" }
              - { label: "Nombre o iniciales", name: "nombre", widget: "string" }
              - { label: "Texto de la opinión", name: "texto", widget: "text" }
              - { label: "Producto relacionado (opcional)", name: "producto", widget: "string", required: false }
              - { label: "Fecha (opcional)", name: "fecha", widget: "string", required: false }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options:
                  - { label: "Publicada", value: "publicada" }
                  - { label: "Pendiente de revisar", value: "pendiente" }
                  - { label: "Oculta", value: "oculta" }

  - name: "faq"
    label: "Preguntas frecuentes"
    files:
      - file: "data/faq.json"
        label: "FAQ"
        name: "faq"
        fields:
          - label: "Preguntas"
            name: "faq"
            widget: "list"
            label_singular: "Pregunta"
            fields:
              - { label: "Pregunta", name: "pregunta", widget: "string" }
              - { label: "Respuesta", name: "respuesta", widget: "text" }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options:
                  - { label: "Publicada", value: "publicada" }
                  - { label: "Borrador (no se ve en la web)", value: "borrador" }

  - name: "blog"
    label: "El Grimorio (Blog)"
    folder: "el-grimorio-articulos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha (opcional; no se muestra en la web)", name: "date", widget: "datetime", required: false, hint: "Puedes dejarla vacía. No se enseña a quien visita. Solo sirve para ordenar: sin fecha, el artículo sale el primero." }
      - { label: "Imagen destacada", name: "imagen", widget: "image", required: false, choose_url: false }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        required: false
        options: ["Simbolismo", "Artesanía", "Plantas", "Magia popular", "Regalos", "Cuidados"]
      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "borrador"
        options:
          - { label: "Borrador", value: "borrador" }
          - { label: "Publicado", value: "publicado" }
      - { label: "Título SEO (opcional)", name: "seo_titulo", widget: "string", required: false }
      - { label: "Descripción SEO (opcional)", name: "seo_descripcion", widget: "text", required: false }
      - { label: "Contenido del artículo", name: "body", widget: "markdown" }

  # ---------------------------------------------------------------
  # INICIO — fotos y vídeos de las cuatro secciones multimedia
  # ---------------------------------------------------------------
  - name: "inicio"
    label: "Inicio — Fotos y vídeos"
    files:
      - file: "data/inicio.json"
        label: "Fotos y vídeos de la página de inicio"
        name: "inicio"
        fields:
          - label: "Portada — Magia hecha con las manos (fotos cuadradas, 1200 × 1200 px)"
            name: "hero"
            widget: "object"
            fields:
              - label: "Carrusel de fotos y vídeos"
                name: "media"
                widget: "list"
                required: false
                label_singular: "Foto o vídeo"
                fields:
                  - label: "Tipo"
                    name: "tipo"
                    widget: "select"
                    options:
                      - { label: "Foto", value: "imagen" }
                      - { label: "Vídeo", value: "video" }
                    default: "imagen"
                  - label: "Foto"
                    name: "src"
                    widget: "image"
                    required: false
                    choose_url: false
                    hint: "Selecciona una foto de tu biblioteca. Si eliges Vídeo arriba, deja este campo vacío."
                  - label: "Vídeo"
                    name: "video"
                    widget: "file"
                    required: false
                    choose_url: false
                    hint: "Sube un vídeo MP4. Si eliges Foto arriba, deja este campo vacío."
                  - { label: "Texto opcional", name: "titulo", widget: "string", required: false }
                  - { label: "Texto alternativo", name: "alt", widget: "string", required: false }

          - label: "Hecho a mano — manos trabajando la arcilla (fotos cuadradas, 1200 × 1200 px)"
            name: "hecho_a_mano"
            widget: "object"
            fields:
              - label: "Carrusel de fotos y vídeos"
                name: "media"
                widget: "list"
                required: false
                label_singular: "Foto o vídeo"
                fields:
                  - { label: "Tipo", name: "tipo", widget: "select", options: [{ label: "Foto", value: "imagen" }, { label: "Vídeo", value: "video" }], default: "imagen" }
                  - { label: "Foto", name: "src", widget: "image", required: false, choose_url: false }
                  - { label: "Vídeo", name: "video", widget: "file", required: false, choose_url: false, hint: "Vídeo MP4" }
                  - { label: "Texto opcional", name: "titulo", widget: "string", required: false }
                  - { label: "Texto alternativo", name: "alt", widget: "string", required: false }

          - label: "Personalización — pieza personalizada (fotos cuadradas, 1200 × 1200 px)"
            name: "personalizacion"
            widget: "object"
            fields:
              - label: "Carrusel de fotos y vídeos"
                name: "media"
                widget: "list"
                required: false
                label_singular: "Foto o vídeo"
                fields:
                  - { label: "Tipo", name: "tipo", widget: "select", options: [{ label: "Foto", value: "imagen" }, { label: "Vídeo", value: "video" }], default: "imagen" }
                  - { label: "Foto", name: "src", widget: "image", required: false, choose_url: false }
                  - { label: "Vídeo", name: "video", widget: "file", required: false, choose_url: false, hint: "Vídeo MP4" }
                  - { label: "Texto opcional", name: "titulo", widget: "string", required: false }
                  - { label: "Texto alternativo", name: "alt", widget: "string", required: false }

          - label: "El Taller — taller o artesana (fotos cuadradas, 1200 × 1200 px)"
            name: "taller"
            widget: "object"
            fields:
              - label: "Carrusel de fotos y vídeos"
                name: "media"
                widget: "list"
                required: false
                label_singular: "Foto o vídeo"
                fields:
                  - { label: "Tipo", name: "tipo", widget: "select", options: [{ label: "Foto", value: "imagen" }, { label: "Vídeo", value: "video" }], default: "imagen" }
                  - { label: "Foto", name: "src", widget: "image", required: false, choose_url: false }
                  - { label: "Vídeo", name: "video", widget: "file", required: false, choose_url: false, hint: "Vídeo MP4" }
                  - { label: "Texto opcional", name: "titulo", widget: "string", required: false }
                  - { label: "Texto alternativo", name: "alt", widget: "string", required: false }

          - label: "Huerto — fotos de mi huerto (cuadradas, 1200 × 1200 px)"
            name: "huerto"
            widget: "object"
            fields:
              - label: "Carrusel de fotos y vídeos"
                name: "media"
                widget: "list"
                required: false
                label_singular: "Foto o vídeo"
                hint: "Salen en la sección «Mi huerto» de la portada. La PRIMERA foto también sale pequeñita en las páginas de Infusiones, Inciensos y Plantas / Semillas."
                fields:
                  - { label: "Tipo", name: "tipo", widget: "select", options: [{ label: "Foto", value: "imagen" }, { label: "Vídeo", value: "video" }], default: "imagen" }
                  - { label: "Foto", name: "src", widget: "image", required: false, choose_url: false }
                  - { label: "Vídeo", name: "video", widget: "file", required: false, choose_url: false, hint: "Vídeo MP4" }
                  - { label: "Texto opcional", name: "titulo", widget: "string", required: false }
                  - { label: "Texto alternativo (describe la foto)", name: "alt", widget: "string", required: false }

          - label: "Personalizados — fotos de la página «Personalizados»"
            name: "personalizados"
            widget: "object"
            fields:
              - label: "Carrusel de fotos y vídeos"
                name: "media"
                widget: "list"
                required: false
                label_singular: "Foto o vídeo"
                hint: "Si lo dejas vacío, la página Personalizados enseña las fotos de «Personalización». Medida recomendada: 1200 × 1200 px (cuadrada)."
                fields:
                  - { label: "Tipo", name: "tipo", widget: "select", options: [{ label: "Foto", value: "imagen" }, { label: "Vídeo", value: "video" }], default: "imagen" }
                  - { label: "Foto", name: "src", widget: "image", required: false, choose_url: false }
                  - { label: "Vídeo", name: "video", widget: "file", required: false, choose_url: false, hint: "Vídeo MP4" }
                  - { label: "Texto opcional", name: "titulo", widget: "string", required: false }
                  - { label: "Texto alternativo", name: "alt", widget: "string", required: false }

  # ---------------------------------------------------------------
  # SECCIONES DE LA TIENDA — crear, publicar u ocultar secciones
  # ---------------------------------------------------------------
  - name: "secciones"
    label: "Secciones de la tienda"
    label_singular: "Sección"
    folder: "data/secciones"
    create: true
    delete: true
    identifier_field: "nombre"
    slug: "{{identificador}}"
    extension: "json"
    format: "json"
    summary: "{{nombre}} — {{publicada | ternary('● PUBLICADA','○ oculta')}}"
    sortable_fields: ["orden", "nombre"]
    fields:
      - { label: "Nombre de la sección", name: "nombre", widget: "string", hint: "Es lo que se ve en el menú y en las tarjetas. Ej.: San Valentín" }
      - { label: "Identificador (sin espacios ni tildes)", name: "identificador", widget: "string", pattern: ["^[a-z0-9-]+$", "Solo letras minúsculas sin tilde, números y guiones. Ej.: san-valentin"], hint: "Es la dirección de la sección. No lo cambies una vez publicada. Ej.: san-valentin" }
      - { label: "¿Publicada? (visible en la web)", name: "publicada", widget: "boolean", default: false, hint: "ACTIVADA = la sección se ve en la web. APAGADA = se oculta (sin borrar nada) y puedes volver a activarla cuando quieras." }
      - { label: "Orden", name: "orden", widget: "number", value_type: "int", default: 500, required: false, hint: "Número menor = sale antes. Las de siempre van de 10 en 10 (Grimorios 10, Amuletos 20…)." }
      - { label: "Mostrar en el menú Tienda", name: "mostrarEnMenu", widget: "boolean", default: true, required: false }
      - { label: "Mostrar como tarjeta en la portada y en la tienda", name: "mostrarEnTarjetas", widget: "boolean", default: true, required: false }
      - { label: "Foto de la tarjeta", name: "fotoTarjeta", widget: "image", required: false, choose_url: false, hint: "Foto de la tarjeta de la portada y la tienda. Si la dejas vacía, sale la foto de la primera pieza de la sección (o un símbolo)." }
      - { label: "Foto de la parte de arriba de la página", name: "fotoCabecera", widget: "image", required: false, choose_url: false, hint: "Imagen alargada (1448 × 540 px). En Infusiones e Inciensos sustituye a la imagen de «próximamente»." }
      - { label: "Texto de la foto de arriba (describe la imagen)", name: "altCabecera", widget: "string", required: false }
      - { label: "Texto de presentación", name: "introduccion", widget: "text", required: false, hint: "Aparece bajo el título en las secciones nuevas. Escribe 2–3 frases que expliquen qué hay aquí." }
      - { label: "Descripción para Google (opcional)", name: "descripcionSeo", widget: "text", required: false, hint: "Una frase (máx. 150 letras) que aparece en Google. Si la dejas vacía, se usa el texto de presentación." }
